line-length = 120

[lint]
select = [
    "E4", "E7", "E9", "F",
    "I",
    "UP",
    "PLW1508",
    "PIE790",
]
ignore = [
    "E501",
    "E712",
]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
]
